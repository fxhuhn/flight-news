# ==============================================================================
# FLIGHT DEAL BOT - KONFIGURATION
# ==============================================================================

[origin]
# Eigener Heimatflughafen für Zubringer- und Positionierungsflüge
home_airport = "HAM"

# Bevorzugte Startflughäfen/Hubs (Direktabflüge oder unkomplizierte Zubringer ohne extra Positionierungsaufwand)
preferred_hubs = ["HAM", "FRA", "BER"]

[destinations]
# Erlaubte Zielregionen für Deals (Asien umfasst Ost-, Südost-, Süd- und Zentralasien)
regions = ["Asien", "Zentralasien", "Südamerika", "Mittelamerika"]

# Spezifische Sweet-Spot-Airports: Nahost-/QP-Airports (Miles & More Interkontinental: 200 Points + 200 QP)
# sowie Wunsch-Ziele außerhalb der Hauptregionen (Georgien: TBS Tiflis, BUS Batumi, KUT Kutaissi)
sweet_spots = ["DXB", "DWC", "AUH", "JED", "RUH", "MCT", "SLL", "DOH", "AMM", "AQJ", "TLV", "BEY", "TBS", "BUS", "KUT"]

# Persönliche Wunschziele (3-Letter IATA-Codes): Werden bei Sammel-Deals mit mehreren Zielen
# bevorzugt als Hauptziel gewählt (inkl. Google-Flights-Link & eigenem Duplikat-Fingerprint)
# und im Telegram-Push mit ⭐ hervorgehoben.
priority_destinations = ["MNL", "KUL"]

[pricing]
# Maximalpreis in EUR Return ab den bevorzugten Hubs (HAM, FRA, BER)
max_price_home_hubs = 2600

# Maximalpreis in EUR Return für alle übrigen europäischen Abflüge / Ex-EU (z.B. CPH, MUC, AMS, WAW, OSL, ARN, PRG, DUB, MXP, BUD)
max_price_ex_eu = 2000

[airlines]
# Airlines, die bei den Angeboten ignoriert werden sollen (Ausschluss nach Name oder IATA-Code).
# Deals dieser Airlines werden nicht als Angebot angezeigt und direkt verworfen.
ignored_airlines = [
    "Azerbaijan Airlines",
    "AZAL",
    "Turkmenistan Airlines",
    "T5",
    "MIAT",
    "Mongolian Airlines",
]

[system]
# Modus beim Start mit neuer/leerer Datenbank:
# "eval_recent" = (Standard) Bewertet die Top-N neuesten Deals sofort & markiert den Rest als gesehen
# "silent"      = Stummes Befüllen (alle vorhandenen Deals als gesehen markieren, erst ab Zyklus 2 bewerten)
# "off"         = Deaktiviert (normale Endlosverarbeitung aller vorhandenen Einträge)
initial_seed_mode = "eval_recent"
initial_seed_max_deals = 5

# Maximale Anzahl an Einträgen, die pro RSS-Feed pro Scan ausgewertet werden
max_entries_per_feed = 25

# Haltedauer (in Tagen) für gesendete Deals in sent_deals (Duplikatsperre & Preissturz-Historie)
sent_deals_retention_days = 21

# Recycelte Deal-URLs (z.B. Reisetopia) erneut prüfen, wenn das RSS-Veröffentlichungsdatum mind. X Tage neuer ist
url_reeval_after_days = 7

# Google Flights Live-Preis-Check (Soft-Check mit Fail-Open, inkl. optionalem Positionierungsflug)
enable_google_flights_live_check = true


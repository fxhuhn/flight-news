name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build Docker image (local test target)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          pull: true
          tags: flight-news:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.73.0'
          image-ref: 'flight-news:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Ensure Trivy SARIF validity
        if: always()
        run: |
          if [ ! -s trivy-results.sarif ]; then
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Container Smoke Test (Pre-Push Gate)
        run: |
          set -euo pipefail
          echo "Starting smoke test in built Docker container..."
          docker run --rm \
            -e CONFIG_PATH=/app/config.toml \
            flight-news:test \
            python -c "
          import bot
          from pathlib import Path
          cfg = bot.load_config()
          assert cfg['origin']['home_airport'] == 'HAM', 'Config origin mismatch'
          assert len(cfg['destinations']['regions']) > 0, 'No destinations configured'
          # Teste Dateisystem-Rechte des Non-Root-Users 'appuser' im Datenvolume
          test_p = Path('/app/data/perm_test.tmp')
          test_p.write_text('write_ok')
          assert test_p.read_text() == 'write_ok'
          test_p.unlink()
          print('✅ Smoke Test passed: Python environment, permissions & config.toml are verified!')
          "

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

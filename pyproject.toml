[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_suite.py" = ["E402", "F841", "F401"]
"run_*.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["no-redef", "union-attr", "assignment", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

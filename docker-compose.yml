services:
  flight-deal-bot:
    image: ghcr.io/fxhuhn/flight-news:main
    container_name: flight-deal-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -45 | grep -q heartbeat || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
